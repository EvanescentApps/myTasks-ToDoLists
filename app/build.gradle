plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.plugin.serialization'
}
apply plugin: 'kotlin-android'

android {
    signingConfigs {
        debug {
            keyAlias 'todolistapp'
            keyPassword '@OmegaNano4497'
            storePassword '@OmegaNano4497'
            storeFile file('C:\\Users\\ecoca\\Documents\\Projets IT\\Projets Android\\Source\\ToDoList\\todolistapp.jks')
        }
        release {
            storeFile file('C:\\Users\\ecoca\\Documents\\Projets IT\\Projets Android\\Source\\ToDoList\\todolistapp.jks')
            storePassword '@OmegaNano4497'
            keyAlias 'todolistapp'
            keyPassword '@OmegaNano4497'
        }
    }
    compileSdkVersion 33

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId "com.electro.todolist"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 15
        versionName "1.5 Blue"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
